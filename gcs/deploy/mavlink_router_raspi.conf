# =============================================================================
# mavlink_router_raspi.conf — Raspberry Pi 用 mavlink-router 設定
# =============================================================================
# Pixhawk TELEM1 と GCS（UDP:14550）間の MAVLink ルーティング。
#
# 配置先: /etc/mavlink-router/main.conf
#
# GPIO ピンアサイン:
#   /dev/ttyAMA0 = GPIO 8(TXD), 10(RXD)  → Pixhawk TELEM1
#
# 前提:
#   - mavlink-router がインストール済み（sudo apt install mavlink-router）
#   - /dev/ttyAMA0 が有効化済み（config.txt: enable_uart=1）
#
# 起動:
#   sudo cp gcs/deploy/mavlink_router_raspi.conf /etc/mavlink-router/main.conf
#   sudo systemctl restart mavlink-router
# =============================================================================

[General]
# ログ出力
Log = /var/log/mavlink-router.log
DebugLog = /var/log/mavlink-router-debug.log

# MAVLink Dialect（v1/v2 自動検出のため指定しない）
MavlinkDialect = common

[UartEndpoint to_pixhawk]
Device = /dev/ttyAMA0
Baud = 921600

# GCS向け UDP エンドポイント（全 GCS config が期待する標準ポート）
[UdpEndpoint to_gcs]
Address = 0.0.0.0
Port = 14550
Mode = Server

# 追加: TCP エンドポイント（直接 TCP 接続用・デバッグ用）
[TcpEndpoint to_gcs_tcp]
Address = 0.0.0.0
Port = 5760
