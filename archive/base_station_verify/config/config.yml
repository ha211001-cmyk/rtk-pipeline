# ============================================================================
# F9P 基地局 設定ファイル
# ============================================================================
# プラットフォームに応じてコメントアウトを切り替えて使用してください。
# デフォルトはラズパイ（Linux）向けです。
# ============================================================================

# --- ラズパイ（Linux）設定 ---
f9p:
  serial_port: /dev/ttyACM2
  baudrate: 115200

# --- Windows 設定（使用時にコメントアウトを切り替え）---
# f9p:
#   serial_port: COM8
#   baudrate: 115200

base_station:
  mode: manual
  # mode: auto  # USBポート自動検出 + 単独測位で基準座標を自動取得する場合
  # auto_obs_duration: 60  # auto モード時の単独測位時間（秒）
  fixed_lat: 36.0751418   # manual モード時の基準座標（度）
  fixed_lon: 136.2133477
  fixed_alt: 44.80
  save_to_flash: false
